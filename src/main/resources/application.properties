spring.application.name=eventhub
#name of springboot application, used in logs and microservices

spring.datasource.url=jdbc:postgresql://localhost:5432/eventhub_db
#Database connection URL which connects springboot to database

spring.datasource.username=postgres
spring.datasource.password=***REDACTED***

spring.jpa.hibernate.ddl-auto=update
#Automatically creates/updates database tables based on your Entity classes, no need to write manual sql queries.

server.port=8081
#application runs on this port

