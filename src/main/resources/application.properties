spring.application.name=eventhub
#name of springboot application, used in logs and microservices

spring.datasource.url=jdbc:postgresql://localhost:5432/eventhub_db
#Database connection URL which connects springboot to database

spring.datasource.username=postgres
spring.datasource.password=***REDACTED***

spring.jpa.hibernate.ddl-auto=update
#Automatically creates/updates database tables based on your Entity classes, no need to write manual sql queries.

server.port=8081
#application runs on this port

spring.data.redis.host=localhost
spring.data.redis.port=6379
#Spring Boot connects to Redis running on your local machine at port 6379.

# Kafka server (running on 9092)
spring.kafka.bootstrap-servers=localhost:9092

# Producer
#Converts message key to bytes
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#Converts actual message (payload)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
#Defines a consumer group
spring.kafka.consumer.group-id=eventhub-group
#From where should kafka start reading messages
spring.kafka.consumer.auto-offset-reset=earliest
#Converts Kafka binary to String key
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#Converts Kafka binary to actual message
#Convert incoming Kafka message (bytes) into a Java Object using JSON format.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#Which Java packages are allowed to be converted from JSON into objects.
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Tell JsonDeserializer which Java class to deserialize into
spring.kafka.consumer.properties.spring.json.value.default.type=com.eventhub.kafka.Dto.BookingEvent

# Retry Configuration
resilience4j.retry.instances.paymentRetry.max-attempts=3
resilience4j.retry.instances.paymentRetry.wait-duration=2s